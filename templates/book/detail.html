{% extends 'list.html' %}
{% block content %}
    <h2>{{ book.title }}</h2>

    <p>Author: {{ book.author }}</p>
    <p>Pages: {{ book.pages }}</p>
    <p>Price: {{ book.price }}</p>

    <a href="{% url 'book_update' book.pk %}">Edit</a>
    <a href="{% url 'book_delete' book.pk %}">Delete</a>
    <a href="{% url 'book_list' %}">Back</a>
{% endblock  %}

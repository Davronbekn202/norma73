<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1>Books</h1>

<a href="{% url 'book_create' %}">Add Book</a>

<ul>
    {% for book in books %}
        <li>
            <a href="{% url 'book_detail' book.pk %}">
                {{ book.title }}
            </a>
        </li>
    {% endfor %}
</ul>

<div>
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
